    <style>
        :root {
            --bg-dark: #0a0c10;
            --card-bg: #12161f;
            --gold-primary: #d4af37;
            --gold-light: #f3e5ab;
            --text-main: #e6edf3;
            --text-muted: #8b949e;
            --border-gold: rgba(212, 175, 55, 0.3);
            --accent-blue: #58a6ff;
            --border-color: #30363d;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        header {
            border-bottom: 1px solid var(--border-gold);
            padding: 2.5rem 1rem;
            text-align: center;
            background: linear-gradient(180deg, rgba(212, 175, 55, 0.08) 0%, rgba(10, 12, 16, 1) 100%);
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        .hero-title {
            color: var(--gold-primary);
            font-size: 2.3rem;
            margin-bottom: 0.5rem;
            letter-spacing: -0.5px;
        }

        .hero-subtitle {
            color: var(--text-muted);
            font-size: 1.15rem;
            max-width: 800px;
            margin: 0 auto 1.5rem auto;
        }

        .badge-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
        }

        .badge {
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid var(--border-gold);
            color: var(--gold-light);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
            margin: 2.5rem 0;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-gold);
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 24px rgba(212, 175, 55, 0.15);
        }

        .card img {
            width: 100%;
            height: auto;
            border-bottom: 1px solid var(--border-gold);
        }

        .card-body {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card-title {
            color: var(--gold-primary);
            font-size: 1.3rem;
            margin-top: 0;
            margin-bottom: 0.5rem;
        }

        .card-text {
            color: var(--text-muted);
            font-size: 0.95rem;
            flex-grow: 1;
            margin-bottom: 1.5rem;
        }

        .btn {
            display: block;
            text-align: center;
            background: linear-gradient(135deg, #d4af37 0%, #aa820a 100%);
            color: #000;
            font-weight: bold;
            padding: 12px 20px;
            border-radius: 6px;
            text-decoration: none;
            transition: opacity 0.2s ease;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .featured-card {
            grid-column: 1 / -1;
            background: linear-gradient(135deg, rgba(212,175,55,0.08) 0%, rgba(18,22,31,1) 100%);
            border: 2px solid var(--gold-primary);
            display: grid;
            grid-template-columns: 1fr 1fr;
            align-items: center;
        }

        @media (max-width: 768px) {
            .featured-card {
                grid-template-columns: 1fr;
            }
        }

        .doc-section {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
            margin-top: 3rem;
            text-align: left;
        }

        h2.section-heading {
            color: var(--gold-primary);
            font-size: 1.4rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            margin-top: 2rem;
        }

        .article-list {
            list-style: none;
            padding: 0;
            margin-top: 15px;
        }

        .article-item {
            padding: 15px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .article-item:last-child {
            border-bottom: none;
        }

        .article-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--accent-blue);
            text-decoration: none;
        }

        .article-title:hover {
            text-decoration: underline;
        }

        .article-meta {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        pre {
            background-color: #0d1117;
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 6px;
            overflow-x: auto;
            color: #79c0ff;
            font-size: 0.85rem;
        }

        ul, ol { padding-left: 20px; }
        li { margin-bottom: 8px; color: var(--text-main); }
        a { color: var(--accent-blue); text-decoration: none; }
        a:hover { text-decoration: underline; }

        footer {
            border-top: 1px solid var(--border-gold);
            text-align: center;
            padding: 2rem;
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-top: 4rem;
        }
    </style>
</head>

            <span class="badge">Institutional Edition</span>
        </div>
    </header>
